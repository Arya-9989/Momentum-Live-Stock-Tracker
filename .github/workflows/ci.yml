name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        # All groups, so mypy can also type-check the Playwright screenshot script.
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: requirements.txt matches uv.lock
        run: |
          uv export --quiet --format requirements-txt --no-dev --no-emit-project --no-hashes \
            -o requirements.txt
          git diff --exit-code -- requirements.txt

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: momentum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container becomes healthy
        run: |
          docker run -d --name momentum -p 8501:8501 -e MOMENTUM_DEMO=1 momentum:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' momentum)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker ps --filter name=momentum
          test "$status" = "healthy"
          test "$(docker exec momentum id -u)" != "0"
          curl --fail --silent http://localhost:8501/_stcore/health

      - name: App renders inside the image
        # /_stcore/health never runs the script, so also render it headlessly:
        # this catches missing package assets (rail.js, styles.css) and import errors.
        run: |
          docker exec momentum python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py', default_timeout=120).run()
          assert not at.exception, at.exception
          assert len(at.get('plotly_chart')) == 1
          assert [m.label for m in at.metric][:2] == ['6M return', 'Market cap']
          print('rendered')
          "

      - name: Production HTTP layer
        # serve.py: real robots.txt and title, gzip for the static bundle.
        run: |
          robots="$(curl --fail --silent http://localhost:8501/robots.txt)"
          grep -q "User-agent: \*" <<< "$robots"
          page="$(curl --fail --silent http://localhost:8501/)"
          grep -q "<title>Momentum" <<< "$page"
          js="$(grep -o 'static/js/index[^"]*' <<< "$page" | head -n 1)"
          headers="$(curl --fail --silent -D - -o /dev/null -H "Accept-Encoding: gzip" "http://localhost:8501/$js")"
          grep -qi "content-encoding: gzip" <<< "$headers"

      - name: Container logs
        if: always()
        run: docker logs momentum || true
