name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Every repository test also runs against a real Postgres (the SQLite run
    # needs nothing); the conftest picks it up from MOMENTUM_TEST_POSTGRES_URL.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: momentum
          POSTGRES_PASSWORD: momentum
          POSTGRES_DB: momentum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentum -d momentum"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # Alert emails are sent to a real SMTP server and read back through its API.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
          - 1025:1025
          - 8025:8025
    env:
      MOMENTUM_TEST_POSTGRES_URL: postgresql://momentum:momentum@127.0.0.1:5432/momentum
      MOMENTUM_TEST_MAILPIT_API: http://127.0.0.1:8025
      MOMENTUM_TEST_MAILPIT_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        # All groups, so mypy can also type-check the Playwright screenshot script,
        # and all extras (Postgres driver, Authlib) for the tests that use them.
        run: uv sync --locked --all-groups --all-extras

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Chromium for the browser tests
        # tests/test_motion_browser.py mounts the motion components in a real browser.
        run: uv run playwright install --with-deps chromium

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      - name: requirements.txt matches uv.lock
        run: |
          uv export --quiet --format requirements-txt --no-dev --no-emit-project --no-hashes \
            -o requirements.txt
          git diff --exit-code -- requirements.txt

  chart:
    name: Chart component (TypeScript build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/chart/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend/chart
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend/chart
        run: npm run typecheck

      - name: Committed bundle matches the source
        # The built assets are committed (Streamlit serves them from the package's
        # asset_dir); rebuilding must reproduce them byte for byte.
        working-directory: frontend/chart
        run: |
          npm run build
          git diff --exit-code -- ../../src/momentum/ui/chart

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: momentum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container becomes healthy
        run: |
          docker run -d --name momentum -p 8501:8501 -e MOMENTUM_DEMO=1 momentum:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' momentum)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker ps --filter name=momentum
          test "$status" = "healthy"
          test "$(docker exec momentum id -u)" != "0"
          curl --fail --silent http://localhost:8501/_stcore/health

      - name: App renders inside the image
        # /_stcore/health never runs the script, so also render it headlessly:
        # this catches missing package assets (rail.js, kpis.js, styles.css, the chart
        # bundle and its manifest) and import errors.
        run: |
          docker exec momentum python -c "
          import json
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('streamlit_app.py', default_timeout=120).run()
          assert not at.exception, at.exception
          names = [el.proto.component_name for el in at.get('bidi_component')]
          # The chart is served from the installed package's asset_dir, not inlined.
          assert names[0] == 'momentum.price_chart', names
          assert at.get('bidi_component')[0].proto.js_source_path == 'momentum-chart.js'
          data = {e.proto.component_name: e.proto.json for e in at.get('bidi_component')}
          cards = json.loads(data['momentum_kpi_row'])['cards']
          assert [c['label'] for c in cards][:2] == ['6M return', 'Market cap']
          assert 'Apple Inc.' in ' '.join(str(e.proto) for e in at.get('html'))
          print('rendered')
          "

      - name: Saved data works inside the image
        # The non-root user can create and migrate the SQLite database in /data.
        run: |
          docker exec momentum python -c "
          from momentum import store
          from momentum.store.owners import Owner
          repo = store.get_store().watchlists
          owner = Owner('dev_' + 'A' * 22, 'device')
          assert repo.apply(owner, add=['AAPL']).watchlist.symbols == ('AAPL',)
          print('saved')
          "

      - name: Production HTTP layer
        # serve.py: real robots.txt and title, gzip for the static bundle, and the
        # signed HttpOnly device cookie on the document.
        run: |
          robots="$(curl --fail --silent http://localhost:8501/robots.txt)"
          grep -q "User-agent: \*" <<< "$robots"
          document="$(curl --fail --silent -D - -o /dev/null http://localhost:8501/)"
          grep -qi "set-cookie: momentum_device=v1\..*HttpOnly; SameSite=Lax" <<< "$document"
          page="$(curl --fail --silent http://localhost:8501/)"
          grep -q "<title>Momentum" <<< "$page"
          js="$(grep -o 'static/js/index[^"]*' <<< "$page" | head -n 1)"
          headers="$(curl --fail --silent -D - -o /dev/null -H "Accept-Encoding: gzip" "http://localhost:8501/$js")"
          grep -qi "content-encoding: gzip" <<< "$headers"

      - name: Container logs
        if: always()
        run: docker logs momentum || true
