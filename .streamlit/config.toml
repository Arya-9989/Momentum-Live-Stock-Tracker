# Streamlit configuration. Read locally, in Docker and on Streamlit Community Cloud.

[server]
headless = true
runOnSave = false
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# The main menu then holds only the System / Light / Dark theme switcher and
# "About" (set in st.set_page_config), so viewers can override their OS theme.
toolbarMode = "minimal"
showErrorDetails = "none"

# ---------------------------------------------------------------- theme
# Apple Stocks-style restraint: neutral greys, numerals as the hero, and
# market green/red reserved for price state. Tokens match src/momentum/theme.py.
# Inter is loaded with its optical-size axis (opsz 14-32), so large figures use
# the display cut and body text the text cut, from one variable font. The value
# is "<family>:<css url>" only; Streamlit treats everything after the colon as the URL.
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFont = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
baseRadius = "0.625rem"
buttonRadius = "980px"
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "0.75rem"
paddingBottom = "0rem"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#6250d6", "#e87ba4", "#eda100", "#1baf7a"]

[theme.light]
# One action colour (Apple link blue); everything else is grey.
primaryColor = "#0066cc"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
dataframeBorderColor = "#e5e5ea"
dataframeHeaderBackgroundColor = "#f5f5f7"
greenColor = "#1f7a35"
redColor = "#d70015"
grayColor = "#6e6e73"

[theme.dark]
# Same action blue: white text on it (tags, toggles) stays at 5.6:1.
primaryColor = "#0066cc"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1c1c1e"
textColor = "#f5f5f7"
linkColor = "#2997ff"
borderColor = "#38383a"
dataframeBorderColor = "#2c2c2e"
dataframeHeaderBackgroundColor = "#1c1c1e"
greenColor = "#30d158"
redColor = "#ff453a"
grayColor = "#a1a1a6"
