[project]
name = "momentum"
version = "1.0.0"
description = "Streamlit dashboard for global stocks and indices: candlesticks, technical indicators, comparison, a watchlist, alerts and a portfolio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arya Mahindrakar" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Lower bounds are the versions this code is tested with where it relies on recent
# APIs: st.App, widget `bind=` / `persist_state=` and packaged v2 components with
# asset_dir (Streamlit 1.66). Starlette is imported directly by momentum.server, so
# it is declared rather than relied on through Streamlit. The charts are a built
# component (frontend/chart, TradingView Lightweight Charts), not a Python package.
dependencies = [
    "streamlit>=1.66",
    "starlette>=0.46",
    "yfinance>=0.2.66",
    "pandas>=2.2",
    "numpy>=2.0",
    # The Alpha Vantage provider's HTTP client (and its MockTransport replays recorded responses).
    "httpx>=0.28",
]

[project.optional-dependencies]
# Postgres instead of the default SQLite file (MOMENTUM_DATABASE_URL=postgresql://...).
postgres = ["psycopg[binary]>=3.3", "psycopg-pool>=3.3"]
# OIDC sign-in through st.login (Streamlit's own "auth" extra).
auth = ["streamlit[auth]>=1.66"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "mypy>=1.18",
    "pandas-stubs>=2.2",
]
screenshots = ["playwright>=1.50"]
# Build stage of the Docker image only (scripts/precompress.py); never in the runtime image.
precompress = ["brotli>=1.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "RET", "TID", "N", "PD", "NPY",
]
ignore = [
    "PLR0913",  # Streamlit widgets and chart builders legitimately take many keyword arguments
    "PLR2004",  # magic values are fine in tests and thresholds are named where it matters
    "PLC0415",  # deliberate lazy imports (yfinance off the demo path)
]
allowed-confusables = ["–"]  # en dash is intentional in "low – high" ranges

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "streamlit_app.py", "serve.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "brotli", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: runs against Postgres (set MOMENTUM_TEST_POSTGRES_URL; skipped otherwise)",
    "e2e: drives a live app in Chromium (set MOMENTUM_E2E_URL; skipped otherwise)",
    "mailpit: sends real email to Mailpit (set MOMENTUM_TEST_MAILPIT_API; skipped otherwise)",
]
filterwarnings = ["error::FutureWarning:momentum.*"]

[tool.coverage.run]
source = ["momentum"]
branch = true
